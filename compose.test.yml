# Standalone test configuration. Never merge with docker-compose.yml.
name: logpilot-tests
services:
  baseline:
    build:
      context: ./tests/isolated
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - ./shared:/workspace/shared:ro
      - ./prompts:/workspace/prompts:ro
      - ./services/pilot_orchestrator/src:/workspace/services/pilot_orchestrator/src:ro
      - ./services/evaluation_service/src:/workspace/services/evaluation_service/src:ro
      - ./services/ingestion-worker/src:/workspace/services/ingestion-worker/src:ro
      - ./services/mcp_server/src:/workspace/services/mcp_server/src:ro
      - ./scripts/run_isolated_tests.py:/workspace/scripts/run_isolated_tests.py:ro
      - ./tests/test_parser_formats.py:/workspace/tests/test_parser_formats.py:ro
      - ./tests/integration:/workspace/tests/integration:ro
      - ./tests/isolated:/workspace/tests/isolated:ro
    entrypoint: ["python", "-B", "/workspace/scripts/run_isolated_tests.py"]
  vector:
    build:
      context: ./tests/vector
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - ./shared:/workspace/shared:ro
      - ./tests/integration:/workspace/tests/integration:ro
      - ./services/ingestion-worker/src:/workspace/services/ingestion-worker/src:ro
    entrypoint: ["python", "-B", "/workspace/tests/integration/vector_upsert_smoke.py"]
