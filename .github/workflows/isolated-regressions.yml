name: Isolated regressions

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build isolated test image
        run: docker compose -f compose.test.yml build baseline
      - name: Run backend contracts without network or app data
        run: docker compose -f compose.test.yml run --rm --no-deps baseline

      - name: Verify abrupt ingestion crash boundaries
        run: docker compose -f compose.test.yml run --rm --no-deps --entrypoint python baseline -B /workspace/tests/integration/ingestion_crash_smoke.py

      - name: Verify abrupt log worker boundaries
        run: docker compose -f compose.test.yml run --rm --no-deps --entrypoint python baseline -B /workspace/tests/integration/log_worker_crash_smoke.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run browser contracts with synthetic intercepted responses
        run: LOGPILOT_CHROME_PATH="$(node -p 'require("playwright").chromium.executablePath()')" npm test

  vector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build clean vector adapter test environment
        run: docker compose -f compose.test.yml build vector
      - name: Verify persistent vector upserts and process restart without network or app data
        run: docker compose -f compose.test.yml run --rm --no-deps vector
      - name: Verify abrupt document ingestion boundaries
        run: docker compose -f compose.test.yml run --rm --no-deps --entrypoint python vector -B /workspace/tests/integration/document_crash_smoke.py
      - name: Verify legacy reconciliation preserves the offline snapshot
        run: docker compose -f compose.test.yml run --rm --no-deps --entrypoint python vector -B /workspace/tests/integration/reconciliation_smoke.py
      - name: Verify conservative retention planning and disabled deletion
        run: docker compose -f compose.test.yml run --rm --no-deps --entrypoint python vector -B /workspace/tests/integration/retention_smoke.py
